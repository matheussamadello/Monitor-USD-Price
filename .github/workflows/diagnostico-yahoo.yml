name: Diagnostico Yahoo (temporario)

# Execucao manual, so leitura. Investiga por que as velas diarias do
# USD/BRL (Yahoo) chegam com abertura quase igual ao fechamento. Nao
# publica nada; o resultado fica no log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Comparar o codigo atual com o novo (USD/BRL das horas)
        run: |
          git fetch -q origin main
          mkdir -p /tmp/velho && git show origin/main:monitor.mjs > /tmp/velho/monitor.mjs && git show origin/main:ema89-semanal.mjs > /tmp/velho/ema89-semanal.mjs
          cat > /tmp/diag.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          const novo = await import(process.cwd() + "/monitor.mjs");
          const velho = await import("/tmp/velho/monitor.mjs");
          const estado = JSON.parse(readFileSync("docs/estado.json", "utf8"));
          const rn = await novo.build(fetch, structuredClone(estado));
          const rv = await velho.build(fetch, structuredClone(estado));
          const bloco = (t, sec, par) => { const s = (t.split("========== " + sec + " ==========")[1] || "").split("\n==========")[0];
            const i = s.indexOf("\n" + par + "\n"); if (i < 0) return []; const r = s.slice(i + 1); const j = r.slice(1).search(/\n[A-Z0-9]+\/[A-Z]+\n/);
            return (j < 0 ? r : r.slice(0, j + 1)).split("\n"); };
          for (const sec of ["GRAFICO DIARIO", "GRAFICO SEMANAL"]) for (const par of ["USD/BRL", "USDT/BRL"]) {
            const a = bloco(rv.texto, sec, par), b = bloco(rn.texto, sec, par);
            const campo = (l) => l.split(/[:=]/)[0];
            const mapa = (ls) => new Map(ls.filter((l) => l.includes(":")).map((l) => [l.split(":")[0], l]));
            const ma = mapa(a), mb = mapa(b); let dif = 0;
            console.log(`\n===== ${sec} ${par}: ${a.length} -> ${b.length} linhas`);
            for (const [k, v] of mb) { const w = ma.get(k); if (w !== v) { dif++; if (par === "USD/BRL" || !/preco|candle_atual|provisorio|dist|var_pct|volume_atual|fracao/.test(k)) console.log(`  VELHO ${w ?? "(ausente)"}\n  NOVO  ${v}`); } }
            for (const [k, v] of ma) if (!mb.has(k)) console.log(`  SAIU  ${v}`);
            console.log(`  ${dif} campos diferentes`);
          }
          console.log("\nGATILHOS velho:", rv.gatilhos, "\nGATILHOS novo:", rn.gatilhos);
          console.log("fonte novo:", (rn.texto.match(/^fonte: .*$/m) || [])[0]);
          console.log("avisos novo:", (rn.texto.match(/^dados_avisos: .*$/gm) || []).join(" || "));
          EOF
          node /tmp/diag.mjs
          cat > /tmp/horas.mjs <<'EOF'
          const r = await fetch("https://query1.finance.yahoo.com/v8/finance/chart/USDBRL%3DX?interval=1h&range=730d", { headers: { "User-Agent": "Mozilla/5.0" } });
          const x = (await r.json()).chart.result[0], q = x.indicators.quote[0];
          const janelas = [["2026-09-18T18:00Z", "2026-09-21T05:00Z"], ["2026-09-22T20:00Z", "2026-09-23T04:00Z"], ["2026-09-25T18:00Z", "2026-09-26T09:00Z"]];
          for (const [a, b] of janelas) {
            console.log("\n--", a, b);
            x.timestamp.forEach((t, i) => { if (t >= Date.parse(a) / 1000 && t <= Date.parse(b) / 1000)
              console.log(new Date(t * 1000).toISOString(), q.open[i], q.high[i], q.low[i], q.close[i], q.high[i] === q.low[i] ? "PLANA" : ""); });
          }
          let planas = 0, dias = new Map(), fds = 0;
          x.timestamp.forEach((t, i) => { const dow = new Date(t * 1000).getUTCDay(); if (dow === 0 || dow === 6) fds++;
            if (q.high[i] !== null && q.high[i] === q.low[i]) { planas++; const h = new Date(t * 1000).getUTCHours(); dias.set(h, (dias.get(h) || 0) + 1); } });
          console.log("\nhoras planas:", planas, "de", x.timestamp.length, "por hora UTC:", JSON.stringify([...dias].sort((a, b) => a[0] - b[0])), "| horas em sab/dom:", fds);
          EOF
          node /tmp/horas.mjs
