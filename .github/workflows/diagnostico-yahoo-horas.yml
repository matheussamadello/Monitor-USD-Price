# TEMPORARIO: diagnostico das horas do Yahoo em volta do fechamento
# diario. Roda so neste branch e sera apagado junto com ele.
name: Diagnostico Yahoo horas
on:
  push:
    branches: [diag-yahoo-horas]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node diag/diag.mjs
